<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWCC Casilla Golf - Sistema de Gestión</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Login Screen -->
        <div id="loginScreen" class="login-screen">
            <div class="login-box">
                <img src="logo.png" alt="PWCC Logo" class="logo-login">
                <h1>PWCC Casilla Golf</h1>
                <h2>Sistema de Gestión de Casillas</h2>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="username">Usuario</label>
                        <input type="text" id="username" name="username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn-login">Iniciar Sesión</button>
                    <div id="loginError" class="error-message"></div>
                </form>
            </div>
        </div>

        <!-- Main Application -->
        <div id="mainApp" class="main-app" style="display: none;">
            <!-- Header -->
            <header class="header">
                <div class="header-content">
                    <img src="logo.png" alt="PWCC Logo" class="logo-header">
                    <div class="header-info">
                        <h1>PWCC Casilla Golf</h1>
                    </div>
                    <div class="user-info">
                        <button id="logoutBtn" class="btn-logout">Cerrar Sesión</button>
                    </div>
                </div>
            </header>

            <!-- Search Section -->
            <section class="search-section">
                <div class="search-container">
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="Buscar socio por nombre, apellido, número de socio, ubicación..." class="search-input">
                        <button id="clearBtn" class="btn-clear" style="display: none;">✕</button>
                    </div>
                    <div class="results-info">
                        <span id="resultsCount">Escribe para buscar...</span>
                    </div>
                </div>
            </section>

            <!-- Results Section -->
            <section class="results-section">
                <div id="membersTable" class="members-table">
                    <table>
                        <thead>
                            <tr>
                                <th>N° Socio</th>
                                <th>Nombres</th>
                                <th>Elemento</th>
                                <th>Ubicación/Locker</th>
                                <th>Observaciones</th>
                            </tr>
                        </thead>
                        <tbody id="membersTableBody">
                            <!-- Members will be loaded here -->
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
